# loki-config.yaml
# Configures Loki to accept OTLP logs and store them locally
# this is not a distributed config

#
auth_enabled: false

server:
  http_listen_port: 3100


limits_config:
  # Allow OTLP log ingestion
  allow_structured_metadata: true
  # Maximum log line size in bytes
  max_line_size: 256000
  # Retention period for logs
  retention_period: 720h

common:
  ring:
    instance_addr: "127.0.0.1"
    kvstore:
      store: inmemory

  replication_factor: 1
  path_prefix: /loki

schema_config:
  configs:
    - from: 2020-05-15
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  aws:
    s3: s3://us-east-2
    bucketnames: loki-ruler-env
    region: us-east-2
    access_key_id: ${AWS_ACCESS_KEY_ID}
    secret_access_key: ${AWS_SECRET_ACCESS_KEY}
    s3forcepathstyle: false

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100




### sample from Grafana
ingester:
  # Chunk settings
  chunk_idle_period: 30m
  chunk_target_size: 1572864  # 1.5 MB
  chunk_encoding: snappy
  max_chunk_age: 2h
  chunk_block_size: 262144    # 256 KB
  chunk_retain_period: 0s

  # Flush settings
  concurrent_flushes: 32
  flush_check_period: 30s
  flush_op_timeout: 10m



##
compactor:
  working_directory: /loki/retention
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: s3

querier:
  max_concurrent: 16
