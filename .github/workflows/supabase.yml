name: Test backend sever
on:
  workflow_call:
jobs:
  run-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: install supabase
        run: |
          npm install supabase --save-dev
      - name: Initialize supabase
        run: |
            npx supabase init
      - name: Initialize supabase
        run: |
            npx supabase start
